<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hansala embed test — vera signature</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #eef0ee;
        color: #0d1210;
      }
      main {
        max-width: 720px;
        margin: 48px auto;
        padding: 0 20px;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        color: #66706b;
        font-size: 0.95rem;
      }
      .slot {
        margin-top: 24px;
        padding: 28px;
        background: #fff;
        border: 1px solid #e2e6e3;
        border-radius: 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Embed test — /embed/vera?variant=signature</h1>
      <p>Simulated host page with the iframe snippet.</p>
      <div class="slot">
        <iframe
          src="https://hansala.com/embed/vera?variant=signature"
          width="100%"
          height="160"
          style="border: 0; width: 100%; max-width: 100%; background: transparent"
          title="Verified on Hansala"
          loading="lazy"
        ></iframe>
      </div>
    </main>
  </body>
</html>
