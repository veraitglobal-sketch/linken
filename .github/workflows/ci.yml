name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit, authz, email, API contract, journeys
        run: npm run test:unit

      - name: Migration validation
        run: npm run test:migrations

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: E2E smoke + accessibility
        run: npm run test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # Optional: full DB journeys when secrets are configured (does not block PRs without them)
  e2e-auth:
    if: ${{ vars.RUN_E2E_AUTH == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npx playwright install chromium --with-deps
      - name: Authenticated Playwright journeys
        run: npm run test:smoke
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          NEXT_TELEMETRY_DISABLED: "1"

  post-deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && vars.SMOKE_BASE_URL != '') }}
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Post-deploy smoke
        run: npm run smoke:deploy
        env:
          BASE_URL: ${{ vars.SMOKE_BASE_URL }}
